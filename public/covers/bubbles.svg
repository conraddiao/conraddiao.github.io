<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Bubbles — a shareable contact list">
  <defs>
    <style>
      .serif { font-family: 'IBM Plex Serif', Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#3c3c3c"/>

  <!-- connective threads: one link collecting everyone -->
  <g stroke="#EC5829" stroke-width="3" opacity="0.35" fill="none">
    <path d="M470 470 Q600 560 600 620"/>
    <path d="M735 430 Q660 540 600 620"/>
    <path d="M420 690 Q520 660 600 620"/>
    <path d="M795 665 Q700 650 600 620"/>
    <path d="M690 800 Q650 720 600 620"/>
  </g>

  <!-- contact bubbles -->
  <g class="serif" text-anchor="middle" font-weight="600">
    <g>
      <circle cx="470" cy="470" r="150" fill="#EC5829"/>
      <text x="470" y="470" dy="0.35em" font-size="130" fill="#fdece5">M</text>
    </g>
    <g>
      <circle cx="735" cy="430" r="120" fill="none" stroke="#e0e0e0" stroke-width="4"/>
      <text x="735" y="430" dy="0.35em" font-size="104" fill="#e0e0e0">A</text>
    </g>
    <g>
      <circle cx="600" cy="620" r="175" fill="#EC5829" fill-opacity="0.9"/>
      <text x="600" y="620" dy="0.35em" font-size="150" fill="#fdece5">J</text>
    </g>
    <g>
      <circle cx="420" cy="690" r="108" fill="none" stroke="#e0e0e0" stroke-width="4"/>
      <text x="420" y="690" dy="0.35em" font-size="94" fill="#e0e0e0">K</text>
    </g>
    <g>
      <circle cx="795" cy="665" r="132" fill="#EC5829" fill-opacity="0.72"/>
      <text x="795" y="665" dy="0.35em" font-size="112" fill="#fdece5">S</text>
    </g>
    <g>
      <circle cx="690" cy="800" r="92" fill="none" stroke="#EC5829" stroke-width="4"/>
      <text x="690" y="800" dy="0.35em" class="mono" font-size="62" fill="#EC5829">+9</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="90" y="1090" class="mono" font-size="46" fill="#e0e0e0" opacity="0.85">bubbles.fyi</text>
  <text x="90" y="1145" class="serif" font-size="34" fill="#e0e0e0" opacity="0.5">one link · everyone’s contacts</text>
</svg>
